name: Build Focs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o focus-lock.zip -d project

      - name: Locate Gradle project
        run: |
          SETTINGS=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "gradlew not found"
            echo "Creating Gradle wrapper..."
            gradle wrapper --gradle-version 9.7.1
            chmod +x ./gradlew
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon \
            -Pksp.useKSP2=false

      - name: Find APK
        run: |
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focs-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
