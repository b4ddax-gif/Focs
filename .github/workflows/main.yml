name: Build Focs APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o focus-lock.zip -d project

      - name: Find project
        run: |
          SETTINGS=$(find project -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found at: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix KSP version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Changing KSP 2.3.5 to Kotlin 2.2.10 compatible KSP..."

          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.2.10-2.0.2"/' gradle/libs.versions.toml

          grep "googleDevtoolsKsp" gradle/libs.versions.toml

      - name: Create Gradle wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x ./gradlew

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew clean assembleDebug --stacktrace --no-daemon

      - name: Find APK
        run: |
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Focs-debug-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
